name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    timeout-minutes: 15
    env:
      BROWSER_CHANNEL: ${{ matrix.os == 'windows-latest' && 'msedge' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[qa,dev]"
      - run: python -m pytest
      - run: node --check src/spriteforge/web/review.js
      - run: node --check src/spriteforge/web/preview-media.js
      - run: node --check src/spriteforge/web/production.js
      - run: npm ci
      - if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: node tools/ktx_smoke.cjs
      - run: python -m spriteforge init workspace --demo
      - run: python -m spriteforge validate-graph --workspace workspace
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
