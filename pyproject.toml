[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-spriteforge"
version = "0.1.0"
description = "Local sprite asset review, behavior graph editing, and Amadeus pack export"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Code-Amadeus/AMADEUS-SPRITEFORGE"
Repository = "https://github.com/Code-Amadeus/AMADEUS-SPRITEFORGE"
Issues = "https://github.com/Code-Amadeus/AMADEUS-SPRITEFORGE/issues"

[project.optional-dependencies]
qa = ["numpy>=1.24,<3", "opencv-python-headless>=4.8,<5"]
dev = ["pytest>=8,<9"]

[project.scripts]
spriteforge = "spriteforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spriteforge = ["web/*.html", "web/*.css", "web/*.js", "web/vendor/*", "licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
